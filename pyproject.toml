[project]
name = "halifirien"
version = "0.0.0"  # VERSION is canonical; this field is never read
description = "Pushes a live, public health snapshot of a homelab to a static website."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.120",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40",
    "moto[s3]>=5.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
    "types-jsonschema>=4.25",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "DTZ"]
ignore = ["S101"]  # assert is how pytest asserts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
